name: 每日更新籌碼與股價

# 排程已啟用：週一到週五，台北 10:07 起每小時左右一次，到 22:41 為止。
# 撒這麼多個是為了抵銷 GitHub 排程動輒四五小時的延遲，理由見下方 schedule 的註解。
# 排程回看一週（--days 7）；手動觸發才會用到 days / from / to / prices_months 那些參數。
# 注意：repo 連續 60 天沒有任何活動時，GitHub 會自動停用排程並寄信通知。
on:
  workflow_dispatch:
    inputs:
      days:
        description: "回填最近幾天（60 ≒ 兩個月、120 ≒ 四個月）。留空 = 只抓一天"
        required: false
        default: "120"
      date:
        description: "只抓某一天 YYYY/MM/DD（留空 = 今天）。填了 days 就會被忽略"
        required: false
      from:
        description: "自訂回填起日 YYYY/MM/DD（優先於 days）"
        required: false
      to:
        description: "自訂回填迄日，留空 = 今天"
        required: false
      prices_months:
        description: "只補抓股價的月份數（新增股票後用，例如 6）。留空 = 不做"
        required: false
      backfill_large:
        description: "回補十大交易人的『近月』欄位（加欄位後跑一次就好）"
        type: boolean
        default: false
      force:
        description: "覆寫已存在的日期"
        type: boolean
        default: false

  # cron 是 UTC，台灣是 UTC+8。
  #
  # 為什麼有這麼多個：GitHub 的排程是 best-effort，實測本 repo 每天穩定延遲
  # 四到五小時（設 16:17，實際 21:30 才跑），而且改成非整點也沒有改善。
  # 既然延遲量沒辦法控制，就改成「撒一排」——不管延遲是 0 還是 8 小時，
  # 總有一個會落在台北 16:00~18:00 這個想要的窗內。
  #
  # 這樣做的前提是「跑了也不一定要做事」，而這點成立：
  #   * 資料還沒公布 → 期交所回 0 筆 → 當作 pending，只花 1 次請求就結束。
  #   * 當天已經抓完 → --days 7 的回看範圍全部完整 → 一次對外請求都不發。
  # 所以多跑幾次幾乎不花成本，而且腳本本來就是冪等的。
  #
  #   cron      台北      沒有延遲時   延遲 5 小時時（目前的實測值）
  #   07 2      10:07     10:07        15:07
  #   13 3      11:13     11:13        16:13  ←
  #   29 4      12:29     12:29        17:29  ←
  #   41 5      13:41     13:41        18:41
  #   03 6      14:03     14:03        19:03
  #   17 7      15:17     15:17        20:17
  #   23 8      16:23     16:23  ←     21:23
  #   31 9      17:31     17:31  ←     22:31
  #   23 10     18:23     18:23  ←     隔日 00:23
  #   41 14     22:41     22:41        隔日 03:41   （最後一道保險）
  #
  # 分鐘數刻意都不是 0——整點是最壅塞的一分鐘。
  schedule:
    - cron: "7 2 * * 1-5"
    - cron: "13 3 * * 1-5"
    - cron: "29 4 * * 1-5"
    - cron: "41 5 * * 1-5"
    - cron: "3 6 * * 1-5"
    - cron: "17 7 * * 1-5"
    - cron: "23 8 * * 1-5"
    - cron: "31 9 * * 1-5"
    - cron: "23 10 * * 1-5"
    - cron: "41 14 * * 1-5"

concurrency:
  group: daily-update           # 兩個排程重疊時不要同時 push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 全部只用標準庫，所以不需要 pip install

      - name: 先跑測試（解析器與流程）
        run: |
          python3 tests/test_taifex.py
          python3 tests/test_taifut.py
          python3 tests/test_update_daily.py
          python3 tests/test_netssl.py

      # 新增股票之後用。update_daily 對已經有籌碼的日子會整天略過，
      # 所以新股票的歷史股價不會被補上——這一步是專門補那個洞的。
      - name: 補抓股價（只在有指定月份數時執行）
        if: inputs.prices_months != ''
        env:
          IN_PM: ${{ inputs.prices_months }}
        run: |
          set -euo pipefail
          python3 fetch_prices.py --months-back "$IN_PM"
          python3 build_site.py

      # 十大交易人有兩種口徑（所有契約 / 近月），近月是後來才加的欄位。
      # 加欄位之前的歷史沒有那兩欄，跑一次這個補起來，之後就不需要了。
      - name: 回補近月十大欄位（只在勾選時執行）
        if: inputs.backfill_large == true
        run: |
          set -euo pipefail
          python3 backfill_large.py
          python3 build_site.py

      - name: 抓取並更新
        id: update
        # 輸入值走環境變數，不要直接內插進 shell
        env:
          IN_DAYS: ${{ inputs.days }}
          IN_DATE: ${{ inputs.date }}
          IN_FROM: ${{ inputs.from }}
          IN_TO: ${{ inputs.to }}
          IN_FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$EVENT" = "schedule" ]; then
            # 排程回看一週，而不是只抓當天。
            # GitHub 的排程可能整天沒派送（2026/09/14 就發生過），只抓當天的話
            # 那天的資料就永遠是個洞——沒人會發現，因為隔天的排程是綠的。
            # update_daily 對「已經完整」的日子完全不發請求，所以回看一週幾乎不花成本，
            # 卻讓漏掉的那天在下一次排程自己補回來。
            ARGS+=(--days 7 --max-stale-days 5)
          elif [ -n "${IN_FROM:-}" ]; then
            ARGS+=(--from "$IN_FROM")
            # --to 留空就是今天；絕對不要塞一個空字串進去
            if [ -n "${IN_TO:-}" ]; then ARGS+=(--to "$IN_TO"); fi
          elif [ -n "${IN_DAYS:-}" ]; then
            ARGS+=(--days "$IN_DAYS")
          elif [ -n "${IN_DATE:-}" ]; then
            ARGS+=(--date "$IN_DATE")
          fi
          if [ "${IN_FORCE:-}" = "true" ]; then ARGS+=(--force); fi

          echo "執行：python3 update_daily.py ${ARGS[*]:-（無參數）}"
          if [ ${#ARGS[@]} -eq 0 ]; then
            python3 update_daily.py
          else
            python3 update_daily.py "${ARGS[@]}"
          fi

      - name: commit 並 push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "沒有任何變動，不需要 commit。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y/%m/%d')"
          # 兩個排程若重疊，另一個可能已經先 push
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push 失敗，重試 $i"
            sleep 5
          done
          exit 1

name: 每日更新籌碼與股價

# 排程已啟用：週一到週五台北時間 16:00 主跑、18:00 補跑。
# 排程只抓當天；手動觸發才會用到 days / from / to / prices_months 那些參數。
# 注意：repo 連續 60 天沒有任何活動時，GitHub 會自動停用排程並寄信通知。
on:
  workflow_dispatch:
    inputs:
      days:
        description: "回填最近幾天（60 ≒ 兩個月、120 ≒ 四個月）。留空 = 只抓一天"
        required: false
        default: "120"
      date:
        description: "只抓某一天 YYYY/MM/DD（留空 = 今天）。填了 days 就會被忽略"
        required: false
      from:
        description: "自訂回填起日 YYYY/MM/DD（優先於 days）"
        required: false
      to:
        description: "自訂回填迄日，留空 = 今天"
        required: false
      prices_months:
        description: "只補抓股價的月份數（新增股票後用，例如 6）。留空 = 不做"
        required: false
      force:
        description: "覆寫已存在的日期"
        type: boolean
        default: false

  # cron 是 UTC，台灣是 UTC+8：
  #   0 8  = 台北 16:00（證交所約 14:30、期交所約 15:00 出資料，留一小時緩衝）
  #   0 10 = 台北 18:00（補抓；公布延遲或 GitHub 排程被延後時靠這次）
  # 腳本是冪等的，所以兩次都跑、或跟手動觸發重疊，結果都一樣。
  schedule:
    - cron: "0 8 * * 1-5"
    - cron: "0 10 * * 1-5"

concurrency:
  group: daily-update           # 兩個排程重疊時不要同時 push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 全部只用標準庫，所以不需要 pip install

      - name: 先跑測試（解析器與流程）
        run: |
          python3 tests/test_taifex.py
          python3 tests/test_taifut.py
          python3 tests/test_update_daily.py

      # 新增股票之後用。update_daily 對已經有籌碼的日子會整天略過，
      # 所以新股票的歷史股價不會被補上——這一步是專門補那個洞的。
      - name: 補抓股價（只在有指定月份數時執行）
        if: inputs.prices_months != ''
        env:
          IN_PM: ${{ inputs.prices_months }}
        run: |
          set -euo pipefail
          python3 fetch_prices.py --months-back "$IN_PM"
          python3 build_site.py

      - name: 抓取並更新
        id: update
        # 輸入值走環境變數，不要直接內插進 shell
        env:
          IN_DAYS: ${{ inputs.days }}
          IN_DATE: ${{ inputs.date }}
          IN_FROM: ${{ inputs.from }}
          IN_TO: ${{ inputs.to }}
          IN_FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$EVENT" = "schedule" ]; then
            # 排程只抓當天，並檢查資料是不是太久沒更新
            ARGS+=(--max-stale-days 5)
          elif [ -n "${IN_FROM:-}" ]; then
            ARGS+=(--from "$IN_FROM")
            # --to 留空就是今天；絕對不要塞一個空字串進去
            if [ -n "${IN_TO:-}" ]; then ARGS+=(--to "$IN_TO"); fi
          elif [ -n "${IN_DAYS:-}" ]; then
            ARGS+=(--days "$IN_DAYS")
          elif [ -n "${IN_DATE:-}" ]; then
            ARGS+=(--date "$IN_DATE")
          fi
          if [ "${IN_FORCE:-}" = "true" ]; then ARGS+=(--force); fi

          echo "執行：python3 update_daily.py ${ARGS[*]:-（無參數）}"
          if [ ${#ARGS[@]} -eq 0 ]; then
            python3 update_daily.py
          else
            python3 update_daily.py "${ARGS[@]}"
          fi

      - name: commit 並 push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "沒有任何變動，不需要 commit。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y/%m/%d')"
          # 兩個排程若重疊，另一個可能已經先 push
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push 失敗，重試 $i"
            sleep 5
          done
          exit 1
